services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:4000
      NODE_ENV: development
    depends_on:
      - server
  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: development
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: moa
      POSTGRES_DB: moa
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  client_node_modules:
  server_node_modules:
  postgres_data:
